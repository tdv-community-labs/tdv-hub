name: Autonomous Developer Agent

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Reponu Klonla
        uses: actions/checkout@v4

      - name: Python Quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Asılılıqları Yüklə
        run: pip install google-genai

      - name: Agent Kodu Yazır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'Manual Run' }}
          ISSUE_BODY: ${{ github.event.issue.body || 'No description provided' }}
        run: python .github/scripts/autonomous_coder.py

      - name: Pull Request Yarat
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: agent tərəfindən həll olundu"
          title: "🤖 Agent PR: ${{ github.event.issue.title || 'Manual Optimization' }}"
          body: |
            Bu Pull Request avtomatik olaraq agent tərəfindən yaradıldı.
          branch: "agent-solution-${{ github.run_id }}"
          delete-branch: true
